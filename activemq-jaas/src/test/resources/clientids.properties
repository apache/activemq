##
## clientId authorization rules used by ClientIdPropertiesLoginModuleTest.

# Format: <userId> = <may register a network connection: true|false>, <clientId patterns...>

# admin may use any clientId but is not a network bridge
admin = false, *
# 'first' has an explicit rule: an exact id plus a wildcard, no network connections
first = false, first-primary, first-*
# 'second' has no explicit entry and falls back to the generic per-user rule
${userId} = false, ${userId}-*
# 'system' operates network bridges: may use the bridge clientId formats and is
# explicitly allowed to register network connections. ${brokerName} expands to the
# name of the broker doing the authentication.
system = true, NC_*_inbound_${brokerName}, NC_*_outbound
# 'broken' is missing the leading boolean; the rule is ignored and denies everything
broken = broken-*
