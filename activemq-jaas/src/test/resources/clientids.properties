##
## clientId authorization rules used by ClientIdPropertiesLoginModuleTest.

# admin may use any clientId
admin = *
# 'first' has an explicit rule: an exact id plus a wildcard
first = first-primary, first-*
# 'second' has no explicit entry and falls back to the generic per-user rule
${userId} = ${userId}-*
