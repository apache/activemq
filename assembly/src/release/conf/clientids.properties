##
## Optional clientId authorization for the PropertiesLoginModule.
## Enable by adding this option to the module in login.config:
##     org.apache.activemq.jaas.properties.clientid="clientids.properties"
##
## When enabled, a connection's clientId is authenticated together with the user
## credentials: the clientId must match one of the patterns allowed for the
## authenticated user, otherwise login fails. A connection that sets no clientId
## is allowed (it cannot own a durable subscription).
##
## Format:  <userId> = <true|false>, <comma-separated clientId patterns>
##   the first value states whether the user may register a network connection
##   and is required; an entry without it is ignored and denies the user everything
##   '*'           is a multi-character wildcard
##   ${userId}     in a pattern expands to the authenticated user name
##   ${brokerName} in a pattern expands to the name of this broker
##   an entry keyed ${userId} is the fallback applied to any user that has no
##   explicit entry; with no matching entry the clientId is denied.
##
## Network connections are a separate permission from clientIds: a connection that
## identifies itself as a network bridge is refused unless its user's rule starts
## with true, no matter which clientIds the user may use. This applies both when the
## bridge announces itself before authenticating and when an already authenticated
## connection later declares itself a bridge, so an application account can never
## register as a network connection.
##
## Network bridges use these clientIds (prefix is the networkConnector name,
## default NC; token is the connector clientIdToken, default _):
##   on the broker being connected to:    NC_<remoteBrokerName>_outbound
##   on the broker running the connector: NC_<remoteBrokerName>_inbound_${brokerName}
##   duplex, connector side:              NC_<remoteBrokerName>_inbound_duplex_${brokerName}
## A bridge user therefore needs a true rule with matching patterns on both brokers.

# admin may use any clientId, but is not a network bridge
admin = false, *

# examples of a per-user rule (explicit list or wildcard):
# order = false, order-primary, order-batch
# order = false, order-*

# example bridge account: matches the network connector clientId formats and is
# explicitly allowed to register network connections
# bridge = true, NC_*_outbound, NC_*_inbound_${brokerName}, NC_*_inbound_duplex_${brokerName}

# zero-provisioning default: each user may use clientIds prefixed with their own
# id, e.g. user 'order' may use 'order-1' or 'order-<random>'. Pair this with
# clientIDPrefix="${userId}-" on the client ConnectionFactory.
${userId} = false, ${userId}-*
