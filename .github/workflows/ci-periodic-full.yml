#
# This build runs once a week. It does the same as ci-periodic-quick.yml but runs all the possible tests
# (as opposed to the quick profile only), on the latest Ubuntu, Windows and MacOS images with Java 17 and 25.
# It takes a very long time to run. Use ci-manual.yaml to run the full test suite on demand.
#
name: CI Periodic Full

on:
  schedule:
    - cron: '0 2 * * 6'

jobs:
  build:
    name: build

    if: github.event.repository.fork != true

    permissions:
      contents: read

    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, windows-2025, macos-26 ]
        java-version: [ 17, 25 ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: 'maven'
      - name: Build
        run: mvn -U -B -e clean install -DskipTests
      - name: Verify
        run: mvn apache-rat:check

  test:
    name: test
    needs: build

    permissions:
      contents: read
      checks: write
      pull-requests: write

    timeout-minutes: 480

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, windows-2025, macos-26 ]
        java-version: [ 17, 25 ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: 'maven'
      - name: Test
        shell: bash
        run: mvn -B -e -fae verify -Dsurefire.rerunFailingTestsCount=3
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-java${{ matrix.java-version }}
          path: '**/target/surefire-reports/*.xml'
      - name: Publish Test Results
        if: always() && runner.os == 'Linux'
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          large_files: true
          report_individual_runs: true
          report_suite_logs: error
          check_name: Test Results (${{ matrix.os }}, Java ${{ matrix.java-version }})
          files: '**/target/surefire-reports/*.xml'
